<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="culinaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <pattern id="culinaryPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.5" fill="#fed7aa" opacity="0.25"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="300" height="420" rx="8" fill="url(#culinaryGrad)"/>
  <rect width="300" height="420" rx="8" fill="url(#culinaryPattern)"/>
  
  <!-- Left Spine Shadow & Stitching -->
  <rect x="0" y="0" width="22" height="420" fill="#000" opacity="0.2"/>
  <line x1="22" y1="0" x2="22" y2="420" stroke="#fcd34d" stroke-dasharray="4,4" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Ornate Frame -->
  <rect x="36" y="24" width="236" height="372" rx="6" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.8"/>
  <rect x="42" y="30" width="224" height="360" rx="4" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.5"/>
  
  <!-- Center Emblem: Cloche & Cutlery Hand-Drawn style -->
  <g transform="translate(150, 180)" stroke="#fffbeb" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plate & Cloche -->
    <ellipse cx="0" cy="30" rx="55" ry="8" stroke-width="2.5"/>
    <path d="M -45,28 C -45,-15 45,-15 45,28 Z" fill="#fffbeb" fill-opacity="0.15"/>
    <!-- Handle -->
    <circle cx="0" cy="-22" r="5" fill="#fffbeb"/>
    
    <!-- Crossed Fork & Spoon -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="28" fill="#fffbeb" fill-opacity="0.1"/>
      <path d="M -15,-15 L 15,15 M -15,15 L 15,-15" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Wheat Stems at bottom -->
  <g stroke="#fde047" fill="none" stroke-width="1.5" opacity="0.75">
    <path d="M 80,350 Q 150,330 220,350" />
    <circle cx="110" cy="342" r="3" fill="#fde047"/>
    <circle cx="150" cy="336" r="3.5" fill="#fde047"/>
    <circle cx="190" cy="342" r="3" fill="#fde047"/>
  </g>
</svg>
