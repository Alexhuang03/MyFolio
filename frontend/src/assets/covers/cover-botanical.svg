<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="botanicalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="8" fill="url(#botanicalGrad)"/>
  
  <rect x="0" y="0" width="22" height="420" fill="#000" opacity="0.25"/>
  <line x1="22" y1="0" x2="22" y2="420" stroke="#a7f3d0" stroke-dasharray="3,3" stroke-width="1.5" opacity="0.6"/>
  
  <rect x="36" y="24" width="236" height="372" rx="6" fill="none" stroke="#6ee7b7" stroke-width="1.5" opacity="0.6"/>
  
  <!-- Botanical Branches & Leaves -->
  <g stroke="#a7f3d0" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Branch -->
    <path d="M 150,260 Q 140,200 155,120"/>
    <!-- Left Leaves -->
    <path d="M 147,220 C 130,210 120,225 145,232" fill="#6ee7b7" fill-opacity="0.3"/>
    <path d="M 149,170 C 125,160 115,180 148,185" fill="#6ee7b7" fill-opacity="0.3"/>
    <!-- Right Leaves -->
    <path d="M 152,195 C 170,185 180,205 152,210" fill="#6ee7b7" fill-opacity="0.3"/>
    <path d="M 154,145 C 175,135 185,155 153,160" fill="#6ee7b7" fill-opacity="0.3"/>
    <!-- Top Leaf -->
    <path d="M 155,120 C 145,100 165,100 155,120" fill="#6ee7b7" fill-opacity="0.4"/>
  </g>
  
  <circle cx="150" cy="185" r="55" fill="none" stroke="#a7f3d0" stroke-width="1" stroke-dasharray="4,4" opacity="0.4"/>
</svg>
