<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="100%" height="100%">
  <defs>
    <linearGradient id="fantasyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="300" height="420" rx="8" fill="url(#fantasyGrad)"/>
  
  <rect x="0" y="0" width="22" height="420" fill="#000" opacity="0.3"/>
  <line x1="22" y1="0" x2="22" y2="420" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
  
  <rect x="36" y="24" width="236" height="372" rx="4" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Magic Constellation & Moon/Star Rune -->
  <g transform="translate(150, 185)">
    <!-- Arcane circles -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#d8b4fe" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#c084fc" stroke-width="1" stroke-dasharray="2,3" opacity="0.8"/>
    
    <!-- Crescent Moon -->
    <path d="M 0,-25 A 25 25 0 0 0 0,25 A 20 20 0 0 1 0,-25 Z" fill="#fbcfe8" opacity="0.8"/>
    
    <!-- 8-point star -->
    <g stroke="#e879f9" stroke-width="1.5" fill="none">
      <line x1="0" y1="-32" x2="0" y2="32"/>
      <line x1="-32" y1="0" x2="32" y2="0"/>
      <line x1="-22" y1="-22" x2="22" y2="22"/>
      <line x1="-22" y1="22" x2="22" y2="-22"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
  </g>
  
  <!-- Sparkles -->
  <circle cx="85" cy="100" r="2.5" fill="#fbcfe8" opacity="0.8"/>
  <circle cx="215" cy="110" r="3" fill="#fbcfe8" opacity="0.7"/>
  <circle cx="95" cy="280" r="2" fill="#fbcfe8" opacity="0.6"/>
  <circle cx="205" cy="270" r="2.5" fill="#fbcfe8" opacity="0.75"/>
</svg>
