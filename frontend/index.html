<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/covers/cover-classic.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyFolio - Gestionnaire de Collections (Concept Livre)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <meta name="color-scheme" content="light dark" />
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('myfolio-theme');
          var isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          var savedWallpaper = localStorage.getItem('myfolio-wallpaper');
          if (savedWallpaper && savedWallpaper !== 'default') {
            document.documentElement.classList.add('wallpaper-' + savedWallpaper);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-100 dark:bg-stone-950 text-stone-800 dark:text-stone-100 antialiased transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
